name: Daily Sports AI Agent

on:
  schedule:
    # Runs automatically every day at 10:00 AM Bangladesh Time (04:00 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows you to run it manually anytime for testing

permissions:
  contents: write # Grants permission to save updated website back to repository

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI Agent & Build Webpage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push Updated Webpage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update daily sports website [skip ci]" || exit 0
          git push
